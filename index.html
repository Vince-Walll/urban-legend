<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0e1126" />
  <title>Urban Legend</title>
  <link href="./dist/output.css" rel="stylesheet">
</head>

<body>
  <div id="logInPage" class="w-full h-[100dvh] bg-black flex justify-center items-center">
    <div id="card" class="w-[300px] flex flex-col rounded-lg p-5 gap-2">
      <h1 class="text-center text-[30px] font-bold">Urban Legend</h1>
      <form id="logInForm" class="flex flex-col gap-4">
        <div>
          <label class="block pl-[5px]" for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Name"
            class="w-full border border-black rounded-full pl-[5px]" required />
        </div>
        <div>
          <label class="block pl-[5px]" for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password"
            class="w-full border border-black rounded-full pl-[5px]" required />
        </div>
        <button type="submit" id="logIn"
          class="w-full border border-black rounded-full mt-[10px] p-1 text-[#fff] bg-[#000]">
          Log in
        </button>
      </form>
      <p class="text-center mt-[5px]">
        No Account?
        <button id="goToCreate" class="text-[blue]">Create Account</button>
      </p>
    </div>
  </div>
  <div id="createAccPage" class="w-full h-[100dvh] bg-black flex justify-center items-center hidden">
    <div id="card2" class="w-[300px] flex flex-col rounded-lg p-5 gap-1">
      <h1 class="text-center text-[30px] font-bold">Create Account</h1>
      <form id="createForm" class="flex flex-col gap-4">
        <div>
          <label class="block pl-[5px]" for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Name"
            class="w-full border border-black rounded-full pl-[5px]" required />
        </div>
        <div>
          <label class="block pl-[5px]" for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password"
            class="w-full border border-black rounded-full pl-[5px]" required />
        </div>
        <div>
          <label class="block pl-[5px]" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password"
            class="w-full border border-black rounded-full pl-[5px]" required />
        </div>
        <button type="submit" id="create"
          class="w-full border border-black rounded-full mt-[10px] p-1 text-[#fff] bg-[#000]">
          Create
        </button>
      </form>
      <p class="text-center mt-[5px]">
        Already Have Account?
        <button id="goToLogIn" class="text-[blue]">Log in</button>
      </p>
    </div>
  </div>
  <div id="home" class="home vertical w-full h-[100dvh] flex hidden">
    <div class="w-full h-[50dvh] flex flex-col justify-between p-[20px]">
      <div id="logOut"></div>
      <div id="heroUi" class="hero w-[60%] h-[100%]"></div>
      <button type="button" id="heroesChanger" class="w-[50px] h-[50px] rounded-full border border-black">
        Heroes
      </button>
    </div>
    <div class="w-full h-[50dvh] flex flex-col justify-between items-end p-[20px]">
      <div id="gold"></div>
      <div id="heroName" class="text-[40px] font-[700] text-[#7ff3ff]">
        Cipher
      </div>
      <div id="leaderBoards"></div>
      <div id="disScores" class="disScores w-[25%] h-[90%] border border-black flex justify-evenly text-center">
        <div class="w-[100%] h-[50%] flex flex-col justify-center">
          <div id="displayScore" class="font-bold text-[20px]"></div>
          <div>Highest Points</div>
        </div>
        <div class="w-[100%] h-[50%] flex flex-col justify-center">
          <div id="displayTime" class="font-bold text-[20px]"></div>
          <div>Longest Time</div>
        </div>
      </div>
      <div type="button" id="start"></div>
    </div>
  </div>

  <div id="box" class="box hidden">
    <div id="player" class="player">
      <div id="appearance" class="appearance"></div>
    </div>
    <div class="battleUi w-full h-[100dvh] flex justify-between p-[20px] relative items-end z-10">
      <div class="w-full h-[60dvh] flex items-end">
        <div id="joyStick" class="joyStick w-[100%] h-[100%]"></div>
      </div>
      <div class="w-full h-[30dvh] flex flex-col justify-between">
        <div class="flex flex-col gap-2 h-[100%]">
          <button id="scores" class="text-right pb-[5px] text-[#ffd23f] text-[1.2rem] border border-black">
            0
          </button>
          <div class="flex h-[100%] gap-2">
            <button id="hp" class="w-[30px] h-[50%] text-[#ff6b6b] border border-black text-left pt-[5px]">
              3
            </button>
            <button id="time" class="w-[30px] text-[#7ff3ff] h-[50%] border border-black text-left pt-[5px]">
              0
            </button>
          </div>
        </div>
        <button type="button" id="ultimate"
          class="w-[100px] h-[100px] rounded-full border-[2px] border-solid border-[#7ff3ff] text-[#fff] mb-auto mt-auto">
          Ult
        </button>
      </div>
    </div>
  </div>
  <script src="javascript/declaration.js"></script>
  <script src="javascript/updator.js"></script>
  <script src="javascript/logIn.js"></script>
  <script src="javascript/script.js"></script>
  <script src="javascript/movement.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>

</html>
