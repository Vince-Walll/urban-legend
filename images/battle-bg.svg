<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- asphalt -->
  <rect width="400" height="400" fill="#23252e"/>
  <!-- darker patches for texture -->
  <rect x="30" y="40" width="70" height="46" rx="18" fill="#1d1f27"/>
  <rect x="250" y="190" width="90" height="56" rx="22" fill="#1d1f27"/>
  <rect x="300" y="320" width="64" height="40" rx="16" fill="#272a34"/>
  <rect x="40" y="270" width="80" height="50" rx="20" fill="#272a34"/>
  <!-- white lane dashes (left lane) -->
  <rect x="97" y="20" width="6" height="100" rx="2" fill="#d9d9d9" fill-opacity=".55"/>
  <rect x="97" y="220" width="6" height="100" rx="2" fill="#d9d9d9" fill-opacity=".55"/>
  <!-- yellow center double line -->
  <rect x="193" y="0" width="5" height="400" fill="#e8b923" fill-opacity=".8"/>
  <rect x="203" y="0" width="5" height="400" fill="#e8b923" fill-opacity=".8"/>
  <!-- white lane dashes (right lane) -->
  <rect x="297" y="20" width="6" height="100" rx="2" fill="#d9d9d9" fill-opacity=".55"/>
  <rect x="297" y="220" width="6" height="100" rx="2" fill="#d9d9d9" fill-opacity=".55"/>
  <!-- cracks -->
  <path d="M130 150 L146 168 L140 184 L158 204" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".7"/>
  <path d="M146 168 L164 164" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-opacity=".7"/>
  <path d="M340 60 L326 80 L336 98 L322 118" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".7"/>
  <path d="M60 340 L78 352 L72 372" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".7"/>
  <!-- manhole cover -->
  <circle cx="250" cy="300" r="22" fill="#2f323d" stroke="#111" stroke-width="3"/>
  <circle cx="250" cy="300" r="15" fill="none" stroke="#111" stroke-width="2" stroke-opacity=".7"/>
  <path d="M238 300 H262 M250 288 V312" stroke="#111" stroke-width="2" stroke-opacity=".7"/>
  <!-- puddle -->
  <ellipse cx="60" cy="110" rx="26" ry="13" fill="#2f4a6b" fill-opacity=".7" stroke="#111" stroke-width="2" stroke-opacity=".5"/>
  <ellipse cx="52" cy="106" rx="9" ry="3.5" fill="#fff" fill-opacity=".25"/>
  <!-- speckles -->
  <g fill="#fff" fill-opacity=".12">
    <circle cx="20" cy="20" r="1.5"/><circle cx="160" cy="60" r="1.5"/><circle cx="370" cy="150" r="1.5"/>
    <circle cx="120" cy="250" r="1.5"/><circle cx="220" cy="380" r="1.5"/><circle cx="350" cy="260" r="1.5"/>
    <circle cx="80" cy="190" r="1.5"/><circle cx="280" cy="70" r="1.5"/><circle cx="30" cy="370" r="1.5"/>
  </g>
</svg>
