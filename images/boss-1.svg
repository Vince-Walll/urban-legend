<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skin" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="200">
      <stop offset="0" stop-color="#55357a"/>
      <stop offset="1" stop-color="#26163a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d3a"/>
      <stop offset="1" stop-color="#08050d"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1c3b"/>
      <stop offset="1" stop-color="#07040b"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2d1d3d"/>
      <stop offset="1" stop-color="#050309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2a4a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ff2a4a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wings -->
  
    <!-- wing membrane -->
    <path d="M135 84 Q76 38 6 20 L34 66 L26 112 L62 98 L66 146 L96 116 L126 130 Z" fill="url(#skin)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    <!-- wing ribs -->
    <path d="M130 88 L12 25" fill="none" stroke="#ff2a4a" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M130 92 L30 106 M128 98 L66 142" fill="none" stroke="#3b2350" stroke-width="2.5" stroke-linecap="round"/>
    <!-- rim light on the leading edge -->
    <path d="M135 84 Q76 38 6 20" fill="none" stroke="#7a4aa3" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>

  <g transform="translate(400,0) scale(-1,1)">
    <!-- wing membrane -->
    <path d="M135 84 Q76 38 6 20 L34 66 L26 112 L62 98 L66 146 L96 116 L126 130 Z" fill="url(#skin)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    <!-- wing ribs -->
    <path d="M130 88 L12 25" fill="none" stroke="#ff2a4a" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M130 92 L30 106 M128 98 L66 142" fill="none" stroke="#3b2350" stroke-width="2.5" stroke-linecap="round"/>
    <!-- rim light on the leading edge -->
    <path d="M135 84 Q76 38 6 20" fill="none" stroke="#7a4aa3" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
</g>

  <!-- torso, tapering to a tail -->
  <path d="M126 78 L274 78 L264 128 L238 168 L212 194 L200 199 L188 194 L162 168 L136 128 Z" fill="url(#skin)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M150 102 L250 102 M158 124 L242 124 M172 146 L228 146" fill="none" stroke="#3b2350" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="200" cy="120" rx="46" ry="44" fill="#7a4fa8" fill-opacity=".22"/>
  <circle cx="200" cy="128" r="16" fill="url(#glow)"/>
  <circle cx="200" cy="128" r="5" fill="#ffe3e3"/>

  <!-- horns -->
  
    <!-- horn -->
    <path d="M156 34 Q122 22 110 2 Q146 10 172 26 Z" fill="url(#horn)" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M114 5 Q144 14 166 28" fill="none" stroke="#ff2a4a" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round"/>

  <g transform="translate(400,0) scale(-1,1)">
    <!-- horn -->
    <path d="M156 34 Q122 22 110 2 Q146 10 172 26 Z" fill="url(#horn)" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M114 5 Q144 14 166 28" fill="none" stroke="#ff2a4a" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round"/>
</g>

  <!-- crown blades -->
  <polygon points="172,22 181,8 190,17" fill="#0b0810" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="228,22 219,8 210,17" fill="#0b0810" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="188,15 200,1 212,15" fill="#0b0810" stroke="#000" stroke-width="3" stroke-linejoin="round"/>

  <!-- head -->
  <polygon points="150,40 160,22 200,14 240,22 250,40 252,70 236,88 200,94 164,88 148,70" fill="url(#skin)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M160 24 L200 16 L240 24" fill="none" stroke="#7a4aa3" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>

  <!-- face -->
  
    <!-- brow, glow, eye -->
    <polygon points="156,44 200,56 200,48 164,38" fill="#04020a" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="180" cy="58" r="26" fill="url(#glow)"/>
    <polygon points="162,50 198,58 194,67 166,63" fill="#ff2a4a" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="171,55 194,60 192,63 173,61" fill="#ffe3e3"/>

  <g transform="translate(400,0) scale(-1,1)">
    <!-- brow, glow, eye -->
    <polygon points="156,44 200,56 200,48 164,38" fill="#04020a" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="180" cy="58" r="26" fill="url(#glow)"/>
    <polygon points="162,50 198,58 194,67 166,63" fill="#ff2a4a" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="171,55 194,60 192,63 173,61" fill="#ffe3e3"/>
</g>
  <polygon points="172,74 228,74 224,86 176,86" fill="#2a0008" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="176,74 184,74 180,86" fill="#d9d0e2"/>
    <polygon points="186,74 194,74 190,82" fill="#d9d0e2"/>
    <polygon points="196,74 204,74 200,86" fill="#d9d0e2"/>
    <polygon points="206,74 214,74 210,82" fill="#d9d0e2"/>
    <polygon points="216,74 224,74 220,86" fill="#d9d0e2"/>
    <polygon points="180,86 188,86 184,80" fill="#d9d0e2"/>
    <polygon points="194,86 202,86 198,80" fill="#d9d0e2"/>
    <polygon points="208,86 216,86 212,80" fill="#d9d0e2"/>
</svg>
