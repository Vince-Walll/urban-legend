  <circle cx="65" cy="56" r="3" fill="#111"/>
  <!-- mouth -->
  <path d="M28 72 Q50 94 72 72 Q50 80 28 72 Z" fill="#1b0a0a" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="36,76 41,76 38.5,83" fill="#fff"/>
